<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">MoE Role Prompting Multi-Agent comparison</title>
  <desc id="desc">Comparison table of MoE, role prompting, and multi-agent.</desc>
  <style>
    .bg{fill:#ffffff}.title{font:800 52px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.sub{font:500 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.head{font:800 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.cell{font:600 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}.note{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.line{stroke:#e5e7eb;stroke-width:3}.r1{fill:#dbeafe}.r2{fill:#ffedd5}.r3{fill:#e0e7ff}.h{fill:#111827}.c{fill:#f9fafb;stroke:#e5e7eb;stroke-width:3;rx:18}
  </style>
  <rect class="bg" width="1080" height="1350"/>
  <text class="title" x="70" y="110">三者到底差在哪？</text>
  <text class="sub" x="70" y="158">先看“发生在哪一层”，基本就不会混淆。</text>
  <rect class="h" x="70" y="230" width="940" height="88" rx="18"/>
  <text class="head" x="110" y="286">概念</text>
  <text class="head" x="305" y="286">发生位置</text>
  <text class="head" x="555" y="286">核心对象</text>
  <text class="head" x="795" y="286">本质</text>
  <rect class="r1" x="70" y="340" width="940" height="150" rx="18"/>
  <text class="cell" x="110" y="405">MoE</text>
  <text class="cell" x="305" y="405">模型内部</text>
  <text class="cell" x="555" y="405">Router / Expert</text>
  <text class="cell" x="795" y="390">参数路径</text>
  <text class="cell" x="795" y="428">分工</text>
  <rect class="r2" x="70" y="520" width="940" height="150" rx="18"/>
  <text class="cell" x="110" y="585">Role</text>
  <text class="cell" x="110" y="625">Prompting</text>
  <text class="cell" x="305" y="585">提示词内部</text>
  <text class="cell" x="555" y="585">角色指令</text>
  <text class="cell" x="795" y="570">回答方式</text>
  <text class="cell" x="795" y="608">约束</text>
  <rect class="r3" x="70" y="700" width="940" height="150" rx="18"/>
  <text class="cell" x="110" y="765">多 Agent</text>
  <text class="cell" x="305" y="765">应用系统内部</text>
  <text class="cell" x="555" y="765">多个智能体</text>
  <text class="cell" x="795" y="750">任务流程</text>
  <text class="cell" x="795" y="788">协作</text>
  <rect class="c" x="70" y="930" width="940" height="250"/>
  <text class="cell" x="120" y="1000">判断口诀：</text>
  <text class="cell" x="120" y="1055">模型内部 = MoE</text>
  <text class="cell" x="120" y="1110">提示词内部 = Role Prompting</text>
  <text class="cell" x="120" y="1165">应用系统内部 = 多 Agent</text>
  <rect x="70" y="1235" width="940" height="80" rx="24" fill="#0f172a"/>
  <text class="note" x="125" y="1287">不要只看“专家”这个比喻，要看分工发生在哪一层。</text>
</svg>
