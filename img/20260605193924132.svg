<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#fbfaf7"/>
  <text x="64" y="76" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#12151c">A practical GUI Agent stack</text>
  <text x="66" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6470">The model is only one layer. Reliability comes from the whole harness.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">
    <rect x="160" y="170" width="880" height="70" rx="12" fill="#ffe8e8" stroke="#e05a5a" stroke-width="3"/>
    <text x="210" y="216" fill="#12151c">Safety and permissions: allowlist, confirmation, audit log</text>
    <rect x="160" y="260" width="880" height="70" rx="12" fill="#fff3db" stroke="#e09f2e" stroke-width="3"/>
    <text x="210" y="306" fill="#12151c">Task memory and reusable skills: login, export, upload, verify</text>
    <rect x="160" y="350" width="880" height="70" rx="12" fill="#e9f8f2" stroke="#16a085" stroke-width="3"/>
    <text x="210" y="396" fill="#12151c">Planner, executor, reflector, evaluator</text>
    <rect x="160" y="440" width="880" height="70" rx="12" fill="#e8f0fe" stroke="#1c5fd4" stroke-width="3"/>
    <text x="210" y="486" fill="#12151c">Perception: screenshot, DOM, OCR, accessibility tree</text>
    <rect x="160" y="530" width="880" height="70" rx="12" fill="#12151c" stroke="#12151c" stroke-width="3"/>
    <text x="210" y="576" fill="#ffffff">Sandbox runtime: browser, desktop VM, phone emulator, app session</text>
  </g>
</svg>
