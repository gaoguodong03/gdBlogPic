<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">MoE is model-internal expert routing</title>
  <desc id="desc">MoE routes tokens to expert FFNs inside the model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#263238"/>
    </marker>
    <style>
      .bg{fill:#f7fbff}.title{font:800 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.sub{font:500 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#486581}.label{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.small{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.box{fill:#fff;stroke:#bcccdc;stroke-width:3;rx:26}.token{fill:#e0f2fe;stroke:#0284c7;stroke-width:3;rx:18}.router{fill:#fff7ed;stroke:#f97316;stroke-width:4;rx:28}.expert{fill:#ecfdf5;stroke:#16a34a;stroke-width:4;rx:24}.line{stroke:#263238;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:4;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="1350"/>
  <text class="title" x="70" y="120">MoE：模型内部的专家分工</text>
  <text class="sub" x="70" y="170">不是多个 Agent，也不是提示词角色，而是模型架构。</text>
  <rect class="box" x="70" y="235" width="940" height="860"/>
  <rect class="token" x="130" y="330" width="170" height="86"/>
  <text class="label" x="168" y="384">token</text>
  <line class="line" x1="300" y1="373" x2="420" y2="373"/>
  <rect class="router" x="420" y="300" width="240" height="146"/>
  <text class="label" x="490" y="362">Router</text>
  <text class="small" x="468" y="402">选择 top-k 专家</text>
  <rect class="expert" x="760" y="245" width="190" height="90"/>
  <text class="label" x="802" y="301">Expert 1</text>
  <rect class="expert" x="760" y="390" width="190" height="90"/>
  <text class="label" x="802" y="446">Expert 2</text>
  <rect class="expert" x="760" y="535" width="190" height="90"/>
  <text class="label" x="802" y="591">Expert 3</text>
  <path class="dash" d="M660 350 C705 315 724 290 760 290"/>
  <path class="dash" d="M660 374 C705 400 724 434 760 434"/>
  <path class="dash" d="M660 405 C710 500 724 570 760 580"/>
  <rect class="box" x="130" y="730" width="820" height="270"/>
  <text class="label" x="170" y="790">关键判断</text>
  <text class="small" x="170" y="845">发生位置：模型内部</text>
  <text class="small" x="170" y="895">核心对象：Router + Expert FFN</text>
  <text class="small" x="170" y="945">解决问题：扩大模型容量，同时控制激活计算量</text>
  <rect x="70" y="1160" width="940" height="94" rx="28" fill="#0f172a"/>
  <text x="110" y="1218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="800" fill="#fff">一句话：MoE 是参数路径的分工，不是聊天角色的分工。</text>
</svg>
