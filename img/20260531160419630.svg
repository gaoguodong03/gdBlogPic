<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">MoE layer overview</title>
  <desc id="desc">A Transformer FFN is replaced by a router and multiple expert FFNs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 16; }
      .box { fill: #eef4ff; stroke: #2e90fa; stroke-width: 2; rx: 12; }
      .expert { fill: #ecfdf3; stroke: #12b76a; stroke-width: 2; rx: 12; }
      .router { fill: #fff6ed; stroke: #f79009; stroke-width: 2; rx: 12; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; font-size: 24px; font-weight: 650; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; font-size: 18px; }
      .line { stroke: #344054; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1080" height="520"/>
  <text class="text" x="54" y="58">Dense FFN 与 MoE FFN 的结构差异</text>
  <rect class="panel" x="54" y="90" width="430" height="360"/>
  <text class="small" x="84" y="132">Dense Transformer Block</text>
  <rect class="box" x="112" y="170" width="160" height="72"/>
  <text class="text" x="146" y="214">Attention</text>
  <line class="line" x1="272" y1="206" x2="328" y2="206"/>
  <rect class="box" x="328" y="170" width="110" height="72"/>
  <text class="text" x="363" y="214">FFN</text>
  <text class="small" x="112" y="305">所有 token 经过同一个 FFN</text>
  <text class="small" x="112" y="338">计算路径固定，部署简单</text>
  <rect class="panel" x="596" y="90" width="430" height="360"/>
  <text class="small" x="626" y="132">MoE Transformer Block</text>
  <rect class="box" x="628" y="170" width="146" height="72"/>
  <text class="text" x="656" y="214">Attention</text>
  <line class="line" x1="774" y1="206" x2="824" y2="206"/>
  <rect class="router" x="824" y="170" width="124" height="72"/>
  <text class="text" x="852" y="214">Router</text>
  <rect class="expert" x="640" y="294" width="112" height="56"/>
  <text class="small" x="664" y="329">Expert 1</text>
  <rect class="expert" x="786" y="294" width="112" height="56"/>
  <text class="small" x="810" y="329">Expert 2</text>
  <rect class="expert" x="932" y="294" width="72" height="56"/>
  <text class="small" x="953" y="329">...</text>
  <path class="dash" d="M 884 242 C 850 270, 750 272, 704 294"/>
  <path class="dash" d="M 888 242 C 888 268, 858 276, 842 294"/>
  <path class="dash" d="M 904 242 C 942 266, 964 274, 970 294"/>
  <text class="small" x="640" y="398">每个 token 只选择 top-k 专家</text>
  <text class="small" x="640" y="431">总参数大，激活参数少</text>
</svg>
